<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>admin | Rupsha Jonokollan Foundation</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo-dot"><i class="fa-solid fa-hands-holding-child"></i></div>
        <div>
          <h2>RJF Admin</h2>
          <span>Control Panel</span>
        </div>
      </div>

      <nav>
        <div class="nav-item" data-route="dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</div>
        <div class="nav-item" data-route="members"><i class="fa-solid fa-file-signature"></i>From Member</div>
        <div class="nav-item" data-route="team"><i class="fa-solid fa-users"></i>Committee</div>
        <div class="nav-item" data-route="donors"><i class="fa-solid fa-hand-holding-heart"></i>Donors</div>
        <div class="nav-item" data-route="gallery"><i class="fa-solid fa-images"></i>Gallery</div>
        <div class="nav-item" data-route="notices"><i class="fa-solid fa-bullhorn"></i>Notice</div>
        <div class="nav-item" data-route="events"><i class="fa-solid fa-calendar-days"></i>Event</div>
        <div class="nav-item" data-route="requests"><i class="fa-solid fa-pen-to-square"></i>Member Data update</div>
        <div class="nav-item" data-route="donations"><i class="fa-solid fa-sack-dollar"></i>Donation</div>
        <div class="nav-item" data-route="documents"><i class="fa-solid fa-file-lines"></i>Document</div>
        <div class="nav-item" data-route="security"><i class="fa-solid fa-shield-halved"></i>Auth mg</div>
      </nav>

      <div class="sidebar-foot">
        <div class="who" id="whoAmI">—</div>
        <div class="nav-item" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>Logout</div>
        <a class="nav-item" href="/#" target="_blank" style="text-decoration:none;"><i class="fa-solid fa-arrow-up-right-from-square"></i>Visit site</a>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
          <div>
            <h1 id="pageTitle">Dashboard</h1>
            <div class="sub" id="pageSub">Rupsha jonokollan foundation— Complete Project Management Admin Panel</div>
          </div>
        </div>
      </div>

      <div class="content" id="viewRoot">
        <div class="empty-state"><i class="fa-solid fa-spinner spin"></i><p>Loading...</p></div>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <div class="confirm-box" id="confirmBox">
    <div class="confirm-card">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <h3 id="confirmTitle">Confirm</h3>
      <p id="confirmMsg">Are you sure?</p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" id="confirmCancel">Chancel</button>
        <button class="btn btn-danger" id="confirmOk">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
